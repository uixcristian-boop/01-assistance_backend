# Nombre de la aplicacion
spring.application.name=assistance_backend

# Configuracion del puerto del servidor
server.port=${PORT:8080}

# Configuracion de la base de datos PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/assistance_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:uixcristian}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de JPA e Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuracion de Resend Email API (HTTPS Puerto 443 - No bloqueado por Render)
resend.api.key=${RESEND_API_KEY:}
resend.from.email=${RESEND_FROM_EMAIL:UCSS Asistencia <onboarding@resend.dev>}

# Configuracion de Spring Mail con Gmail SMTP (Puerto 465 SSL para servidores cloud)
spring.mail.host=smtp.gmail.com
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:soporte.ucss.asistencia@gmail.com}
spring.mail.password=${MAIL_PASSWORD:clave_aplicacion_correo}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.required=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Configuracion de seguridad y JWT
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Limites de tamaño para peticiones HTTP y carga de archivos
server.tomcat.max-http-form-post-size=20MB
server.tomcat.max-swallow-size=20MB
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
